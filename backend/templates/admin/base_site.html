{% block extrastyle %}
{{ block.super }}
<style>

    --primary: #5544ce;
    --secondary: #342867;
    --accent: #ede8ff;

    --header-link-color: #fff;
    --header-branding-color: #fff;
    --link-fg: #4936b6;
